name: TestFlight gate

# This workflow owns the required Pre-merge TestFlight status. It inspects PR
# metadata only and never checks out or executes PR source code. Website/docs/
# CI-only changes are marked successful without an App Store upload; native or
# app-impacting changes remain pending until testflight.yml updates the status.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to classify (for validating or repairing the gate)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: testflight-gate-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: TestFlight scope
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gate logic
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.ref_name }}
          sparse-checkout: .github/scripts/classify-testflight-scope.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve pull request head
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            pr_number="$EVENT_PR_NUMBER"
            head_sha="$EVENT_HEAD_SHA"
          else
            pr_number="$INPUT_PR_NUMBER"
            case "$pr_number" in
              ''|*[!0-9]*)
                echo "Error: pr_number must be numeric, got '$pr_number'"
                exit 1
                ;;
            esac
            head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')"
          fi

          case "$pr_number" in
            ''|*[!0-9]*)
              echo "Error: could not resolve a numeric pull request number"
              exit 1
              ;;
          esac

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Classify changed files
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files.txt"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "$changed_files"

          echo "Changed files:"
          sed 's/^/  /' "$changed_files"

          requires_testflight="$(node .github/scripts/classify-testflight-scope.mjs < "$changed_files")"
          echo "requires_testflight=$requires_testflight" >> "$GITHUB_OUTPUT"
          echo "requires_testflight=$requires_testflight"

      - name: Mark native app changes pending
        if: steps.scope.outputs.requires_testflight == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context='Pre-merge TestFlight' \
            -f description='Native app changes detected; run the TestFlight workflow before merging.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Mark website-only changes successful
        if: steps.scope.outputs.requires_testflight == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context='Pre-merge TestFlight' \
            -f description='Skipped: website, documentation, or CI-only changes; no native app files changed.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
