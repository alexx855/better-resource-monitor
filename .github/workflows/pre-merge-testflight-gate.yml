name: Pre-merge TestFlight gate

# This workflow runs from the base repository so a pull request cannot rewrite
# the classifier that decides whether its own app changes need TestFlight.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  classify:
    name: Classify TestFlight requirement
    runs-on: ubuntu-latest
    concurrency:
      group: testflight-status-${{ github.repository }}-${{ github.event.pull_request.head.sha }}
      queue: max
      cancel-in-progress: false

    steps:
      - name: Checkout trusted classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/classify-testflight-changes.mjs
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - name: Set required status for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The shared status lock prevents a late classifier from replacing an
          # upload result. Preserve only statuses pointing at trusted TestFlight runs.
          target="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/status" \
            --jq '.statuses[] | select(.context == "Pre-merge TestFlight") | .target_url // empty')"
          run_prefix="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/"
          if [[ "$target" == "$run_prefix"* ]]; then
            run_id="${target#"$run_prefix"}"
            if [[ "$run_id" =~ ^[0-9]+$ ]]; then
              upload_owned="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}" \
                --jq '.path == ".github/workflows/testflight.yml" and .event == "workflow_dispatch" and .head_branch == "main"')"
              if [ "$upload_owned" = true ]; then
                echo 'Preserving existing TestFlight upload status for this head'
                exit 0
              fi
            fi
          fi

          # Fetch immutable event commits without checking out or executing PR code.
          # The live PR files API can change while this event is queued.
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          app_file="$(git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" | node scripts/classify-testflight-changes.mjs --null)"

          if [ -n "$app_file" ]; then
            state="pending"
            description="Required: app-impacting change needs TestFlight"
          else
            state="success"
            description="Skipped: no Tauri app files changed"
          fi

          gh api "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context='Pre-merge TestFlight' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
