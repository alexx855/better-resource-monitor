name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit JavaScript dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check locale parity
        run: node scripts/check-locale-parity.mjs

      - name: Check website types
        run: pnpm --filter www check

      - name: Build website
        run: pnpm build:www

      - name: Verify macOS signing scripts
        run: |
          set -euo pipefail
          for script in scripts/setup-appstore-signing.sh scripts/setup-developer-id-signing.sh; do
            bash -n "$script"
          done

      - name: Install cargo-audit
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Check Intel macOS target
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin

      - name: Verify macOS app bundle layout
        run: |
          pnpm tauri build --bundles app --target x86_64-apple-darwin
          APP_PATH="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Better Resource Monitor.app"
          test ! -d "$APP_PATH/Contents/Library/LaunchAgents"
          PRIVACY_MANIFEST="$APP_PATH/Contents/Resources/PrivacyInfo.xcprivacy"
          test -f "$PRIVACY_MANIFEST"
          plutil -lint "$PRIVACY_MANIFEST"
          DISK_CATEGORY=$(/usr/libexec/PlistBuddy -c "Print :NSPrivacyAccessedAPITypes:0:NSPrivacyAccessedAPIType" "$PRIVACY_MANIFEST")
          DISK_REASON=$(/usr/libexec/PlistBuddy -c "Print :NSPrivacyAccessedAPITypes:0:NSPrivacyAccessedAPITypeReasons:0" "$PRIVACY_MANIFEST")
          test "$DISK_CATEGORY" = "NSPrivacyAccessedAPICategoryDiskSpace"
          test "$DISK_REASON" = "85F4.1"
