name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit JavaScript dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check locale parity
        run: node scripts/check-locale-parity.mjs

      - name: Test CI policy and Pages deployment verification
        run: >-
          node --test
          scripts/classify-testflight-changes.test.mjs
          scripts/verify-pages-deployment.test.mjs
          scripts/ci-pages-deployment-contract.test.mjs

      - name: Check website types
        run: pnpm --filter www check

      - name: Build website
        run: pnpm build:www

      - name: Verify macOS signing scripts
        run: |
          set -euo pipefail
          for script in scripts/setup-appstore-signing.sh scripts/setup-developer-id-signing.sh; do
            bash -n "$script"
          done

      - name: Install cargo-audit
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Check Intel macOS target
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin

      - name: Verify macOS app bundle layout
        run: |
          pnpm tauri build --bundles app --target x86_64-apple-darwin
          APP_PATH="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Better Resource Monitor.app"
          test ! -d "$APP_PATH/Contents/Library/LaunchAgents"
          PRIVACY_MANIFEST="$APP_PATH/Contents/Resources/PrivacyInfo.xcprivacy"
          test -f "$PRIVACY_MANIFEST"
          plutil -lint "$PRIVACY_MANIFEST"
          DISK_CATEGORY=$(/usr/libexec/PlistBuddy -c "Print :NSPrivacyAccessedAPITypes:0:NSPrivacyAccessedAPIType" "$PRIVACY_MANIFEST")
          DISK_REASON=$(/usr/libexec/PlistBuddy -c "Print :NSPrivacyAccessedAPITypes:0:NSPrivacyAccessedAPITypeReasons:0" "$PRIVACY_MANIFEST")
          test "$DISK_CATEGORY" = "NSPrivacyAccessedAPICategoryDiskSpace"
          test "$DISK_REASON" = "85F4.1"

      - name: Resolve Cloudflare Pages deployment
        id: pages-deployment
        env:
          DEPLOYMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          check_json=""
          for _ in {1..30}; do
            check_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${DEPLOYMENT_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Cloudflare Pages")] | sort_by(.started_at) | last // empty')"

            if [ -n "$check_json" ] && [ "$(jq -r '.status' <<< "$check_json")" = "completed" ]; then
              break
            fi

            sleep 10
          done

          if [ -z "$check_json" ]; then
            echo "Error: Cloudflare Pages did not report a deployment for $DEPLOYMENT_SHA"
            exit 1
          fi

          conclusion="$(jq -r '.conclusion' <<< "$check_json")"
          if [ "$conclusion" != "success" ]; then
            echo "Error: Cloudflare Pages deployment for $DEPLOYMENT_SHA concluded $conclusion"
            exit 1
          fi

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            base_url="https://better-resource-monitor.alexpedersen.dev"
          else
            base_url="$(jq -r '.output.summary' <<< "$check_json" \
              | grep -oE 'https://[0-9a-f]+\.silicon-monitor\.pages\.dev' \
              | head -n 1)"
          fi

          if [ -z "$base_url" ]; then
            echo "Error: Cloudflare Pages check did not expose an immutable preview URL"
            exit 1
          fi

          echo "base-url=$base_url" >> "$GITHUB_OUTPUT"
          echo "Resolved deployed website: $base_url"

      - name: Verify deployed website
        env:
          PAGES_DEPLOYMENT_BASE_URL: ${{ steps.pages-deployment.outputs.base-url }}
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            if node scripts/verify-pages-deployment.mjs; then
              exit 0
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Deployment has not converged yet; retrying in 10 seconds"
              sleep 10
            fi
          done

          exit 1
