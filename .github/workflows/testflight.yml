name: TestFlight

# Uploads a TestFlight build without changing repository version files.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional numeric CFBundleVersion to use for this upload'
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload-testflight:
    name: Upload TestFlight build
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DISTRIBUTION_IDENTITY: ${{ secrets.APPLE_DISTRIBUTION_IDENTITY }}
      APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
      APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
      APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
      APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
      APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPSTORE_CONNECT_API_KEY_P8: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate scripts
        run: bash -n scripts/setup-appstore-signing.sh

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare App Store credentials
        run: bash scripts/setup-appstore-signing.sh

      - name: Resolve build metadata
        id: build-metadata
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          input_build_number="$INPUT_BUILD_NUMBER"
          if [ -n "$input_build_number" ]; then
            case "$input_build_number" in
              ''|*[!0-9]*)
                echo "Error: build_number input must be numeric, got '$input_build_number'"
                exit 1
                ;;
            esac
            build_number="$input_build_number"
          else
            run_number="$GITHUB_RUN_NUMBER"
            timestamp_floor="$(date -u +%Y%m%d%H%M%S)"
            if [ "$run_number" -lt "$timestamp_floor" ]; then
              build_number="$timestamp_floor"
            else
              build_number="$run_number"
            fi
          fi
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Upload to App Store Connect
        uses: ./.github/actions/upload-appstore
        with:
          build-number: ${{ steps.build-metadata.outputs.build_number }}
          build-commit: ${{ steps.build-metadata.outputs.sha }}
