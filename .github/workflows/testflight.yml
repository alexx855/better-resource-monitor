name: TestFlight

# Uploads a TestFlight build without changing repository version files.
# Website, documentation, and CI-only PRs are automatically marked successful
# by testflight-gate.yml and should not dispatch this workflow.
#
# Security invariant: the workflow is split into two jobs so that untrusted
# code (the source_ref checkout: pnpm lifecycle scripts, build.rs, tests, the
# app build itself) never runs in the same job that holds Apple signing
# credentials. Job `build` has no access to the `testflight` environment or
# any APPLE_* secret; job `sign-upload` executes only trusted scripts from
# `main` and treats the downloaded artifact strictly as data to sign.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional numeric CFBundleVersion to use for this upload'
        required: false
        type: string
      source_ref:
        description: 'Git ref to build; dispatch this workflow from main'
        required: false
        type: string
      pr_number:
        description: 'Optional app-impacting PR number to mark with the Pre-merge TestFlight status'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: testflight-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build app bundle
    runs-on: macos-15
    outputs:
      build_number: ${{ steps.build-metadata.outputs.build_number }}
      sha: ${{ steps.build-metadata.outputs.sha }}

    steps:
      - name: Require main workflow dispatch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Error: dispatch TestFlight from main and pass -f source_ref=... for another ref."
            exit 1
          fi

      - name: Resolve source ref
        id: source
        env:
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ] && [ -z "$INPUT_SOURCE_REF" ]; then
            echo "Error: pr_number requires source_ref so the tested PR head is explicit."
            exit 1
          fi

          source_ref="$INPUT_SOURCE_REF"
          if [ -z "$source_ref" ]; then
            source_ref="$GITHUB_REF_NAME"
          fi

          if [ "$source_ref" != "main" ] \
            && ! [[ "$source_ref" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] \
            && ! [[ "$source_ref" =~ ^refs/pull/[0-9]+/head$ ]]; then
            echo "Error: source_ref must be main, a v* tag, or refs/pull/<number>/head, got '$source_ref'"
            exit 1
          fi

          {
            echo "ref<<BRM_EOF"
            echo "$source_ref"
            echo "BRM_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout trusted workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Checkout source ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          path: source
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: './source/src-tauri -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'pnpm'
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Validate trusted scripts
        run: |
          bash -n scripts/build-appstore-bundle.sh
          bash -n scripts/setup-appstore-signing.sh
          bash -n scripts/upload-appstore-package.sh

      - name: Run Rust tests
        run: cargo test --manifest-path source/src-tauri/Cargo.toml

      - name: Resolve build metadata
        id: build-metadata
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          input_build_number="$INPUT_BUILD_NUMBER"
          if [ -n "$input_build_number" ]; then
            case "$input_build_number" in
              ''|*[!0-9]*)
                echo "Error: build_number input must be numeric, got '$input_build_number'"
                exit 1
                ;;
            esac
            build_number="$input_build_number"
          else
            run_number="$GITHUB_RUN_NUMBER"
            timestamp_floor="$(date -u +%Y%m%d%H%M%S)"
            if [ "$run_number" -lt "$timestamp_floor" ]; then
              build_number="$timestamp_floor"
            else
              build_number="$run_number"
            fi
          fi
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Mark pre-merge TestFlight pending
        if: ${{ inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ steps.build-metadata.outputs.build_number }}
          BUILD_SHA: ${{ steps.build-metadata.outputs.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "Error: pr_number input must be numeric, got '$PR_NUMBER'"
              exit 1
              ;;
          esac

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${BUILD_SHA}" \
            -f state=pending \
            -f context='Pre-merge TestFlight' \
            -f description="Uploading TestFlight build ${BUILD_NUMBER}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Build App Store app bundle
        run: |
          bash scripts/build-appstore-bundle.sh \
            source \
            "${{ steps.build-metadata.outputs.build_number }}" \
            "${{ steps.build-metadata.outputs.sha }}"

      - name: Package app bundle artifact
        run: |
          set -euo pipefail
          # ditto preserves symlinks and extended attributes that a bare
          # upload-artifact zip would drop, which would break code signing.
          ditto -c -k --keepParent \
            "source/src-tauri/target/universal-apple-darwin/release/bundle/macos/Better Resource Monitor.app" \
            "$RUNNER_TEMP/Better-Resource-Monitor.app.zip"

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appstore-app-${{ github.run_id }}
          path: ${{ runner.temp }}/Better-Resource-Monitor.app.zip
          if-no-files-found: error
          retention-days: 1

      - name: Mark pre-merge TestFlight failure
        if: ${{ failure() && inputs.pr_number != '' && steps.build-metadata.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ steps.build-metadata.outputs.build_number }}
          BUILD_SHA: ${{ steps.build-metadata.outputs.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${BUILD_SHA}" \
            -f state=failure \
            -f context='Pre-merge TestFlight' \
            -f description="TestFlight build ${BUILD_NUMBER} failed" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  sign-upload:
    name: Sign and upload to App Store Connect
    needs: build
    runs-on: macos-15
    environment: testflight

    # Security invariant: this job never checks out or executes source_ref
    # code. It runs trusted scripts from main against the downloaded artifact,
    # which is data to be signed, never executed.
    steps:
      - name: Checkout trusted workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Validate trusted scripts
        run: |
          bash -n scripts/setup-appstore-signing.sh
          bash -n scripts/upload-appstore-package.sh

      - name: Download app bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appstore-app-${{ github.run_id }}
          path: ${{ runner.temp }}/appstore-artifact

      - name: Extract and verify app bundle
        env:
          BUILD_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          mkdir -p "$BUNDLE_DIR"
          ditto -x -k "$RUNNER_TEMP/appstore-artifact/Better-Resource-Monitor.app.zip" "$BUNDLE_DIR"

          APP_EXECUTABLE="$BUNDLE_DIR/Better Resource Monitor.app/Contents/MacOS/better-resource-monitor"
          if [ ! -f "$APP_EXECUTABLE" ]; then
            echo "Error: app executable not found at $APP_EXECUTABLE after extraction"
            exit 1
          fi

          COMMIT_PREFIX="$(printf '%s' "$BUILD_SHA" | cut -c1-12)"
          if ! strings -a "$APP_EXECUTABLE" | grep -F "$COMMIT_PREFIX" > /dev/null; then
            echo "Error: downloaded app bundle does not embed expected commit $COMMIT_PREFIX"
            exit 1
          fi
          echo "Downloaded app bundle embeds expected commit $COMMIT_PREFIX"

      - name: Prepare App Store credentials
        env:
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_P8: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8 }}
          PROVISION_PROFILE_OUTPUT: ${{ runner.temp }}/embedded.provisionprofile
        run: bash scripts/setup-appstore-signing.sh

      - name: Upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_IDENTITY: ${{ secrets.APPLE_DISTRIBUTION_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          PROVISION_PROFILE_PATH: ${{ runner.temp }}/embedded.provisionprofile
        run: |
          bash scripts/upload-appstore-package.sh \
            . \
            "${{ needs.build.outputs.build_number }}" \
            "${{ needs.build.outputs.sha }}" \
            "$PROVISION_PROFILE_PATH"

      - name: Mark pre-merge TestFlight success
        if: ${{ success() && inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${BUILD_SHA}" \
            -f state=success \
            -f context='Pre-merge TestFlight' \
            -f description="TestFlight build ${BUILD_NUMBER} uploaded" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="✅ Pre-merge TestFlight uploaded for \`${BUILD_SHA:0:12}\` as build \`${BUILD_NUMBER}\`: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Mark pre-merge TestFlight failure
        if: ${{ failure() && inputs.pr_number != '' && needs.build.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${BUILD_SHA}" \
            -f state=failure \
            -f context='Pre-merge TestFlight' \
            -f description="TestFlight build ${BUILD_NUMBER} failed" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
