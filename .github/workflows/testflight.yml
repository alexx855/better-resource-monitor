name: TestFlight

# Uploads a TestFlight build without changing repository version files.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional numeric CFBundleVersion to use for this upload'
        required: false
        type: string
      source_ref:
        description: 'Git ref to build; dispatch this workflow from main'
        required: false
        type: string
      pr_number:
        description: 'Optional PR number to mark with the Pre-merge TestFlight status'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: testflight-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: false

jobs:
  upload-testflight:
    name: Upload TestFlight build
    runs-on: macos-15
    environment: testflight

    steps:
      - name: Require main workflow dispatch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Error: dispatch TestFlight from main and pass -f source_ref=... for another ref."
            exit 1
          fi

      - name: Resolve source ref
        id: source
        env:
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ] && [ -z "$INPUT_SOURCE_REF" ]; then
            echo "Error: pr_number requires source_ref so the tested PR head is explicit."
            exit 1
          fi

          source_ref="$INPUT_SOURCE_REF"
          if [ -z "$source_ref" ]; then
            source_ref="$GITHUB_REF_NAME"
          fi

          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted workflow tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Checkout source ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.source.outputs.ref }}
          path: source
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './source/src-tauri -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: 'pnpm'
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Validate trusted scripts
        run: |
          bash -n scripts/build-appstore-bundle.sh
          bash -n scripts/setup-appstore-signing.sh
          bash -n scripts/upload-appstore-package.sh

      - name: Run Rust tests
        run: cargo test --manifest-path source/src-tauri/Cargo.toml

      - name: Resolve build metadata
        id: build-metadata
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          input_build_number="$INPUT_BUILD_NUMBER"
          if [ -n "$input_build_number" ]; then
            case "$input_build_number" in
              ''|*[!0-9]*)
                echo "Error: build_number input must be numeric, got '$input_build_number'"
                exit 1
                ;;
            esac
            build_number="$input_build_number"
          else
            run_number="$GITHUB_RUN_NUMBER"
            timestamp_floor="$(date -u +%Y%m%d%H%M%S)"
            if [ "$run_number" -lt "$timestamp_floor" ]; then
              build_number="$timestamp_floor"
            else
              build_number="$run_number"
            fi
          fi
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Build App Store app bundle
        run: |
          bash scripts/build-appstore-bundle.sh \
            source \
            "${{ steps.build-metadata.outputs.build_number }}" \
            "${{ steps.build-metadata.outputs.sha }}"

      - name: Mark pre-merge TestFlight pending
        if: ${{ inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ steps.build-metadata.outputs.build_number }}
          BUILD_SHA: ${{ steps.build-metadata.outputs.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "Error: pr_number input must be numeric, got '$PR_NUMBER'"
              exit 1
              ;;
          esac

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${BUILD_SHA}" \
            -f state=pending \
            -f context='Pre-merge TestFlight' \
            -f description="Uploading TestFlight build ${BUILD_NUMBER}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Prepare App Store credentials
        env:
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_P8: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8 }}
          PROVISION_PROFILE_OUTPUT: ${{ runner.temp }}/embedded.provisionprofile
        run: bash scripts/setup-appstore-signing.sh

      - name: Upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_IDENTITY: ${{ secrets.APPLE_DISTRIBUTION_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          PROVISION_PROFILE_PATH: ${{ runner.temp }}/embedded.provisionprofile
        run: |
          bash scripts/upload-appstore-package.sh \
            source \
            "${{ steps.build-metadata.outputs.build_number }}" \
            "${{ steps.build-metadata.outputs.sha }}" \
            "$PROVISION_PROFILE_PATH"

      - name: Mark pre-merge TestFlight success
        if: ${{ success() && inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ steps.build-metadata.outputs.build_number }}
          BUILD_SHA: ${{ steps.build-metadata.outputs.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${BUILD_SHA}" \
            -f state=success \
            -f context='Pre-merge TestFlight' \
            -f description="TestFlight build ${BUILD_NUMBER} uploaded" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="✅ Pre-merge TestFlight uploaded for \`${BUILD_SHA:0:12}\` as build \`${BUILD_NUMBER}\`: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Mark pre-merge TestFlight failure
        if: ${{ failure() && inputs.pr_number != '' && steps.build-metadata.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ steps.build-metadata.outputs.build_number }}
          BUILD_SHA: ${{ steps.build-metadata.outputs.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${BUILD_SHA}" \
            -f state=failure \
            -f context='Pre-merge TestFlight' \
            -f description="TestFlight build ${BUILD_NUMBER} failed" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
