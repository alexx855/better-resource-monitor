name: TestFlight
run-name: TestFlight ${{ inputs.source_ref || 'main' }} build ${{ inputs.build_number || github.run_number }}

# Uploads and verifies a TestFlight build without changing repository version files.
#
# Security invariant: resolution/reporting run on fresh trusted runners. Untrusted
# code (the source_ref checkout: pnpm lifecycle scripts, build.rs, tests, the
# app build itself) never runs in the same job that holds Apple signing
# credentials. Job `build` has no access to the `testflight` environment or
# any APPLE_* secret; job `sign-upload` executes only trusted scripts from
# `main` and treats the downloaded artifact strictly as data to sign.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional numeric CFBundleVersion to use for this upload'
        required: false
        type: string
      source_ref:
        description: 'Git ref to build; dispatch this workflow from main'
        required: false
        type: string
      pr_number:
        description: 'Optional PR number to mark with the Pre-merge TestFlight status'
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: testflight-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable source identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      build_number: ${{ steps.source.outputs.build_number }}
      pr_number: ${{ steps.source.outputs.pr_number }}
    steps:
      - name: Checkout trusted workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve source and build metadata
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: bash scripts/resolve-testflight-source.sh

  pending:
    name: Mark pre-merge TestFlight pending
    needs: resolve
    runs-on: ubuntu-latest
    concurrency:
      group: testflight-status-${{ github.repository }}-${{ needs.resolve.outputs.sha }}
      queue: max
      cancel-in-progress: false
    permissions:
      statuses: write
    steps:
      - name: Report pending on the resolved PR head
        if: ${{ needs.resolve.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          BUILD_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${BUILD_SHA}" \
            -f state=pending \
            -f context='Pre-merge TestFlight' \
            -f description="Uploading TestFlight build ${BUILD_NUMBER}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  build:
    name: Build app bundle
    needs: [resolve, pending]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout resolved source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: './source/src-tauri -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'pnpm'
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Validate trusted scripts
        run: |
          bash -n scripts/build-appstore-bundle.sh
          bash -n scripts/setup-appstore-signing.sh
          bash -n scripts/upload-appstore-package.sh
          node --check scripts/verify-testflight-build.mjs
          node --test scripts/verify-testflight-build.test.mjs

      - name: Run Rust tests
        run: cargo test --manifest-path source/src-tauri/Cargo.toml

      - name: Build App Store app bundle
        env:
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          BUILD_SHA: ${{ needs.resolve.outputs.sha }}
        run: bash scripts/build-appstore-bundle.sh source "$BUILD_NUMBER" "$BUILD_SHA"

      - name: Package app bundle artifact
        run: |
          set -euo pipefail
          # ditto preserves symlinks and extended attributes that a bare
          # upload-artifact zip would drop, which would break code signing.
          ditto -c -k --keepParent \
            "source/src-tauri/target/universal-apple-darwin/release/bundle/macos/Better Resource Monitor.app" \
            "$RUNNER_TEMP/Better-Resource-Monitor.app.zip"

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appstore-app-${{ github.run_id }}
          path: ${{ runner.temp }}/Better-Resource-Monitor.app.zip
          if-no-files-found: error
          retention-days: 1

  sign-upload:
    name: Sign, upload, and verify TestFlight
    needs: [resolve, build]
    runs-on: macos-15
    environment: testflight

    # Security invariant: this job never checks out or executes source_ref
    # code. It runs trusted scripts from main against the downloaded artifact,
    # which is data to be signed, never executed.
    steps:
      - name: Checkout trusted workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate trusted scripts
        run: |
          bash -n scripts/setup-appstore-signing.sh
          bash -n scripts/upload-appstore-package.sh
          node --check scripts/verify-testflight-build.mjs

      - name: Validate resolved metadata before credentials
        env:
          BUILD_SHA: ${{ needs.resolve.outputs.sha }}
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
        run: |
          source scripts/validate-appstore-metadata.sh
          validate_appstore_metadata "$BUILD_SHA" "$BUILD_NUMBER"

      - name: Download app bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appstore-app-${{ github.run_id }}
          path: ${{ runner.temp }}/appstore-artifact

      - name: Extract and verify app bundle
        env:
          BUILD_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          mkdir -p "$BUNDLE_DIR"
          ditto -x -k "$RUNNER_TEMP/appstore-artifact/Better-Resource-Monitor.app.zip" "$BUNDLE_DIR"

          APP_EXECUTABLE="$BUNDLE_DIR/Better Resource Monitor.app/Contents/MacOS/better-resource-monitor"
          if [ ! -f "$APP_EXECUTABLE" ]; then
            echo "Error: app executable not found at $APP_EXECUTABLE after extraction"
            exit 1
          fi

          COMMIT_PREFIX="$(printf '%s' "$BUILD_SHA" | cut -c1-12)"
          if ! strings -a "$APP_EXECUTABLE" | awk -v needle="$COMMIT_PREFIX" 'index($0, needle) { found = 1 } END { exit found ? 0 : 1 }'; then
            echo "Error: downloaded app bundle does not embed expected commit $COMMIT_PREFIX"
            exit 1
          fi
          echo "Downloaded app bundle embeds expected commit $COMMIT_PREFIX"

      - name: Prepare App Store credentials
        env:
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_P8: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8 }}
          PROVISION_PROFILE_OUTPUT: ${{ runner.temp }}/embedded.provisionprofile
        run: bash scripts/setup-appstore-signing.sh

      - name: Upload to App Store Connect
        env:
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          BUILD_SHA: ${{ needs.resolve.outputs.sha }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_IDENTITY: ${{ secrets.APPLE_DISTRIBUTION_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          PROVISION_PROFILE_PATH: ${{ runner.temp }}/embedded.provisionprofile
        run: |
          bash scripts/upload-appstore-package.sh \
            . \
            "$BUILD_NUMBER" \
            "$BUILD_SHA" \
            "$PROVISION_PROFILE_PATH"

      - name: Verify TestFlight processing and internal availability
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          TESTFLIGHT_BUNDLE_ID: dev.alexpedersen.better-resource-monitor
        run: node scripts/verify-testflight-build.mjs "$BUILD_NUMBER"

  report:
    name: Report pre-merge TestFlight result
    needs: [resolve, pending, build, sign-upload]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.pr_number != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: testflight-status-${{ github.repository }}-${{ needs.resolve.outputs.sha }}
      queue: max
      cancel-in-progress: false
    permissions:
      statuses: write
      issues: write
    steps:
      - name: Report result on the resolved PR head
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          BUILD_SHA: ${{ needs.resolve.outputs.sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          PENDING_RESULT: ${{ needs.pending.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UPLOAD_RESULT: ${{ needs.sign-upload.result }}
        run: |
          set -euo pipefail
          state=failure
          description="TestFlight build ${BUILD_NUMBER} failed or was cancelled"
          if [ "$PENDING_RESULT" = success ] && [ "$BUILD_RESULT" = success ] && [ "$UPLOAD_RESULT" = success ]; then
            state=success
            description="TestFlight build ${BUILD_NUMBER} processed for internal testing"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${BUILD_SHA}" \
            -f state="$state" \
            -f context='Pre-merge TestFlight' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$state" = success ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="✅ Pre-merge TestFlight processed and available to internal testers for \`${BUILD_SHA:0:12}\` as build \`${BUILD_NUMBER}\`: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            exit 1
          fi
