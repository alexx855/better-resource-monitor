name: Release

# Bumps the marketing version, tags the release, uploads the App Store package,
# creates the GitHub release, then dispatches Direct Download to attach the
# signed and notarized DMG/ZIP artifacts to it.

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version and bump
        id: bump
        run: |
          CURRENT=$(jq -r '.version' src-tauri/tauri.conf.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ inputs.version_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping from $CURRENT to $NEW_VERSION"

      - name: Update version in all files
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"

          # Update package.json
          jq ".version = \"$NEW_VERSION\"" package.json > tmp.json && mv tmp.json package.json

          # Update tauri.conf.json
          jq ".version = \"$NEW_VERSION\"" src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

          # Update Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml

          # Update Cargo.lock's local package entry
          cargo update --manifest-path src-tauri/Cargo.toml --workspace

      - name: Generate release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use GitHub API to find previous release tag (works across branches)
          LAST_TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then
            # merge-base handles tags on different branches correctly:
            # - tag IS ancestor of HEAD: merge-base = tag itself (normal case)
            # - tag on side branch: merge-base = divergence point
            BASE=$(git merge-base "$LAST_TAG" HEAD 2>/dev/null || echo "")
            if [ -n "$BASE" ]; then
              COMMITS=$(git log ${BASE}..HEAD --pretty=format:"- %s" --no-merges)
            else
              COMMITS=$(git log --pretty=format:"- %s" --no-merges)
            fi
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges)
          fi

          # Write to file for multiline output
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          if [ -z "$COMMITS" ]; then
            echo "- Version bump to ${{ steps.bump.outputs.new_version }}" >> release_notes.md
          else
            echo "$COMMITS" >> release_notes.md
          fi
          echo "" >> release_notes.md
          if [ -n "$LAST_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...v${{ steps.bump.outputs.new_version }}" >> release_notes.md
          fi

          # Output using delimiter for multiline
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit version bump, merge release PR, and tag
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          RELEASE_BRANCH="release/v${NEW_VERSION}-${GITHUB_RUN_ID}"

          git switch -c "$RELEASE_BRANCH"
          rm -f release_notes.md
          git add -A
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin "$RELEASE_BRANCH"

          PR_URL="$(gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "chore: bump version to $NEW_VERSION" \
            --body "Automated version bump for v$NEW_VERSION.")"
          PR_NUMBER="$(gh pr view "$PR_URL" --json number -q '.number')"

          for _ in {1..30}; do
            MERGE_STATE="$(gh pr view "$PR_NUMBER" --json mergeStateStatus -q '.mergeStateStatus')"
            case "$MERGE_STATE" in
              CLEAN|HAS_HOOKS|UNSTABLE)
                break
                ;;
            esac
            sleep 2
          done

          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --subject "chore: bump version to $NEW_VERSION" \
            --body "Automated version bump for v$NEW_VERSION."

          git fetch origin main --tags
          RELEASE_SHA="$(git rev-parse origin/main)"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          git tag "v$NEW_VERSION" "$RELEASE_SHA"
          git push origin "v$NEW_VERSION"

  dispatch-testflight:
    needs: version-bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      testflight_run_id: ${{ steps.dispatch.outputs.testflight_run_id }}
      appstore_build_number: ${{ steps.build-metadata.outputs.appstore_build_number }}
    steps:
      - name: Resolve App Store build number
        id: build-metadata
        run: |
          run_number="$GITHUB_RUN_NUMBER"
          timestamp_floor="$(date -u +%Y%m%d%H%M%S)"
          if [ "$run_number" -lt "$timestamp_floor" ]; then
            appstore_build_number="$timestamp_floor"
          else
            appstore_build_number="$run_number"
          fi
          echo "appstore_build_number=$appstore_build_number" >> "$GITHUB_OUTPUT"

      - name: Dispatch and watch TestFlight upload
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: v${{ needs.version-bump.outputs.new_version }}
          RELEASE_SHA: ${{ needs.version-bump.outputs.release_sha }}
          APPSTORE_BUILD_NUMBER: ${{ steps.build-metadata.outputs.appstore_build_number }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh workflow run testflight.yml \
            --ref main \
            -f source_ref="$RELEASE_REF" \
            -f build_number="$APPSTORE_BUILD_NUMBER"

          run_id=""
          for _ in {1..60}; do
            run_id="$(gh run list \
              --workflow testflight.yml \
              --limit 20 \
              --json databaseId,event,headSha,createdAt \
              --jq ".[] | select(.event == \"workflow_dispatch\" and .headSha == \"$RELEASE_SHA\" and .createdAt >= \"$started_at\") | .databaseId" \
              | head -n 1)"

            if [ -n "$run_id" ]; then
              break
            fi

            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "Error: timed out waiting for TestFlight workflow dispatch for $RELEASE_REF ($RELEASE_SHA)"
            exit 1
          fi

          echo "testflight_run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --exit-status

  create-github-release:
    needs:
      - version-bump
      - dispatch-testflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: v${{ needs.version-bump.outputs.new_version }}

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ needs.version-bump.outputs.release_notes }}
          RELEASE_SHA: ${{ needs.version-bump.outputs.release_sha }}
          RELEASE_TAG: v${{ needs.version-bump.outputs.new_version }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          TESTFLIGHT_RUN_ID: ${{ needs.dispatch-testflight.outputs.testflight_run_id }}
          APPSTORE_BUILD_NUMBER: ${{ needs.dispatch-testflight.outputs.appstore_build_number }}
        run: |
          printf '%s\n' "$RELEASE_BODY" > release_notes.md
          {
            echo ""
            echo "## Build Provenance"
            echo ""
            echo "- Source commit: [\`$RELEASE_SHA\`](https://github.com/$GITHUB_REPOSITORY/commit/$RELEASE_SHA)"
            echo "- Tag: [\`$RELEASE_TAG\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)"
            echo "- Release workflow run: [\`$RELEASE_RUN_ID\`](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID)"
            echo "- TestFlight workflow run: [\`$TESTFLIGHT_RUN_ID\`](https://github.com/$GITHUB_REPOSITORY/actions/runs/$TESTFLIGHT_RUN_ID)"
            echo "- App Store build number: \`$APPSTORE_BUILD_NUMBER\`"
          } >> release_notes.md

          gh release create "v${{ needs.version-bump.outputs.new_version }}" \
            --title "Better Resource Monitor v${{ needs.version-bump.outputs.new_version }}" \
            --notes-file release_notes.md

      # Same GITHUB_TOKEN + actions:write dispatch mechanism the
      # dispatch-testflight job already uses. The Direct Download workflow
      # builds, signs, and notarizes the DMG/ZIP and uploads them to the
      # release created above.
      - name: Dispatch direct-download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.version-bump.outputs.new_version }}
        run: |
          set -euo pipefail
          gh workflow run direct-download.yml --ref main \
            -f tag="$RELEASE_TAG" \
            -f upload_to_release=true
