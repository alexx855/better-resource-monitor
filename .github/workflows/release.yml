name: Release

# Creates a source-only GitHub release. macOS runtime distribution is
# TestFlight/App Store only; App Store packaging is handled by
# scripts/package-for-store.sh outside this release workflow.

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version and bump
        id: bump
        run: |
          CURRENT=$(jq -r '.version' src-tauri/tauri.conf.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ inputs.version_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping from $CURRENT to $NEW_VERSION"

      - name: Update version in all files
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"

          # Update package.json
          jq ".version = \"$NEW_VERSION\"" package.json > tmp.json && mv tmp.json package.json

          # Update tauri.conf.json
          jq ".version = \"$NEW_VERSION\"" src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

          # Update Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml

      - name: Generate release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use GitHub API to find previous release tag (works across branches)
          LAST_TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then
            # merge-base handles tags on different branches correctly:
            # - tag IS ancestor of HEAD: merge-base = tag itself (normal case)
            # - tag on side branch: merge-base = divergence point
            BASE=$(git merge-base "$LAST_TAG" HEAD 2>/dev/null || echo "")
            if [ -n "$BASE" ]; then
              COMMITS=$(git log ${BASE}..HEAD --pretty=format:"- %s" --no-merges)
            else
              COMMITS=$(git log --pretty=format:"- %s" --no-merges)
            fi
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges)
          fi

          # Write to file for multiline output
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          if [ -z "$COMMITS" ]; then
            echo "- Version bump to ${{ steps.bump.outputs.new_version }}" >> release_notes.md
          else
            echo "$COMMITS" >> release_notes.md
          fi
          echo "" >> release_notes.md
          if [ -n "$LAST_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...v${{ steps.bump.outputs.new_version }}" >> release_notes.md
          fi

          # Output using delimiter for multiline
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit and tag
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          rm -f release_notes.md
          git add -A
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin main
          git push origin "v$NEW_VERSION"

  create-github-release:
    needs: version-bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.version-bump.outputs.new_version }}

      - name: Create source-only GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ needs.version-bump.outputs.release_notes }}
        run: |
          printf '%s\n' "$RELEASE_BODY" > release_notes.md
          gh release create "v${{ needs.version-bump.outputs.new_version }}" \
            --title "Better Resource Monitor v${{ needs.version-bump.outputs.new_version }}" \
            --notes-file release_notes.md
