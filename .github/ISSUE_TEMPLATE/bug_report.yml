name: Bug report
description: Report a reproducible problem in Better Resource Monitor.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please include enough detail to reproduce the issue on a Mac.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the shortest steps that trigger the problem.
      placeholder: |
        1. Open Better Resource Monitor
        2. Change ...
        3. See ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "Example: macOS 15.5"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac chip
      options:
        - Apple Silicon
        - Intel
        - Not sure
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Better Resource Monitor version
      placeholder: "Example: 1.1.4"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Add screenshots, logs, or extra context if useful.
    validations:
      required: false
