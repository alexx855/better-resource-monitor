version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    groups:
      javascript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    ignore:
      # Keep the direct tray-icon dependency aligned with Tauri's transitive version.
      # The app uses Tauri's with_inner_tray_icon escape hatch, so a newer direct
      # tray-icon minor creates incompatible Icon/TrayIcon types until Tauri moves.
      - dependency-name: tray-icon
        update-types:
          - "version-update:semver-minor"
    groups:
      rust-dependencies:
        patterns:
          - "*"
