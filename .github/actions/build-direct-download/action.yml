name: Build unsigned direct-download app bundle
description: Build a direct-download macOS app bundle without signing credentials.

inputs:
  source-dir:
    description: Directory containing the validated release source checkout.
    required: true
  build-commit:
    description: Full commit SHA that must be embedded in the built executable.
    required: true
  release-version:
    description: Version expected in the validated release source.
    required: true

runs:
  using: composite
  steps:
    # This action deliberately receives no signing or notarization credentials.
    # source-dir may contain release code that runs lifecycle scripts and build.rs.
    - name: Build unsigned app bundle
      shell: bash
      env:
        SOURCE_DIR_INPUT: ${{ inputs.source-dir }}
        BRM_BUILD_COMMIT_INPUT: ${{ inputs.build-commit }}
        RELEASE_VERSION_INPUT: ${{ inputs.release-version }}
        # Compile-time marker so the runtime guard accepts this non-App-Store
        # build at /Applications without a Mac App Store receipt. App Store
        # builds (scripts/build-appstore-bundle.sh) must never set this.
        BRM_DIRECT_DISTRIBUTION: '1'
      run: |
        set -euo pipefail

        cd "$SOURCE_DIR_INPUT"

        if ! [[ "$BRM_BUILD_COMMIT_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Error: build-commit must be a 40-character lowercase git SHA"
          exit 1
        fi
        if ! [[ "$RELEASE_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: release-version must be a semantic version, got '$RELEASE_VERSION_INPUT'"
          exit 1
        fi
        if [ "$(git rev-parse HEAD)" != "$BRM_BUILD_COMMIT_INPUT" ]; then
          echo "Error: source checkout does not match the validated release commit"
          exit 1
        fi

        VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
        if [ "$VERSION" != "$RELEASE_VERSION_INPUT" ]; then
          echo "Error: source version '$VERSION' does not match release tag version '$RELEASE_VERSION_INPUT'"
          exit 1
        fi

        BRM_BUILD_COMMIT="${BRM_BUILD_COMMIT_INPUT:0:12}"
        export BRM_BUILD_COMMIT

        echo "=== Unsigned Direct Download App Build ==="
        echo "Version: $VERSION"
        echo "Commit: $BRM_BUILD_COMMIT"
        echo ""

        APP_NAME="Better Resource Monitor"
        APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/${APP_NAME}.app"
        APP_EXECUTABLE="$APP_PATH/Contents/MacOS/better-resource-monitor"
        APP_ARCHIVE="$RUNNER_TEMP/direct-download-app.zip"

        if grep -R "IO[R]eport" src-tauri/src src-tauri/Cargo.toml .github scripts; then
          echo "Error: Direct-download source, workflows, or scripts must not reference private GPU sampling APIs"
          exit 1
        fi
        echo "No private GPU sampling source references found"

        echo "Building universal macOS app bundle..."
        pnpm tauri build --bundles app --target universal-apple-darwin

        if [ ! -d "$APP_PATH" ] || [ ! -f "$APP_EXECUTABLE" ]; then
          echo "Error: App bundle or executable not found after build"
          exit 1
        fi

        if ! strings -a "$APP_EXECUTABLE" | awk -v needle="$BRM_BUILD_COMMIT" 'index($0, needle) { found = 1 } END { exit found ? 0 : 1 }'; then
          echo "Error: App executable does not contain expected build commit $BRM_BUILD_COMMIT"
          exit 1
        fi
        echo "Build commit embedded successfully"

        if strings -a "$APP_EXECUTABLE" | grep "IO[R]eport"; then
          echo "Error: App executable contains private GPU sampling references"
          exit 1
        fi
        if [ -d "$APP_PATH/Contents/Library/LaunchAgents" ]; then
          echo "Error: App bundle must not embed LaunchAgents"
          exit 1
        fi

        # Preserve macOS metadata across the untrusted-build to trusted-signing
        # job boundary. The signing job extracts this archive on a fresh runner.
        ditto -c -k --keepParent "$APP_PATH" "$APP_ARCHIVE"
        shasum -a 256 "$APP_ARCHIVE"
