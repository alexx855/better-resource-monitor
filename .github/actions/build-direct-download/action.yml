name: Build direct-download artifacts
description: Build, sign, notarize, and package direct-download macOS release artifacts.

inputs:
  source-dir:
    description: Directory containing the release source checkout.
    required: false
    default: .
  build-commit:
    description: Commit SHA to embed and verify in the built executable.
    required: true
  apple-api-key-id:
    description: App Store Connect API key id used for notarization.
    required: true
  apple-api-issuer:
    description: App Store Connect API issuer used for notarization.
    required: true
  appstore-connect-api-key-p8:
    description: Raw App Store Connect API private key content.
    required: true
  developer-id-application-identity:
    description: Developer ID Application signing identity.
    required: true
  developer-id-application-cert-p12-base64:
    description: Base64-encoded Developer ID Application certificate.
    required: true
  developer-id-application-cert-password:
    description: Password for the Developer ID Application certificate.
    required: true

outputs:
  dmg_path:
    description: Path to the notarized DMG artifact.
    value: ${{ steps.package.outputs.dmg_path }}
  zip_path:
    description: Path to the ZIP artifact containing the notarized app bundle.
    value: ${{ steps.package.outputs.zip_path }}

runs:
  using: composite
  steps:
    - name: Build app bundle
      shell: bash
      env:
        SOURCE_DIR_INPUT: ${{ inputs.source-dir }}
        BRM_BUILD_COMMIT_INPUT: ${{ inputs.build-commit }}
      run: |
        set -euo pipefail

        cd "$SOURCE_DIR_INPUT"

        VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
        BRM_BUILD_COMMIT="$(printf '%s' "$BRM_BUILD_COMMIT_INPUT" | cut -c1-12)"
        export BRM_BUILD_COMMIT

        case "$BRM_BUILD_COMMIT" in
          [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f])
            ;;
          *)
            echo "Error: build-commit must resolve to a 12-character lowercase git commit prefix, got '$BRM_BUILD_COMMIT'"
            exit 1
            ;;
        esac

        echo "=== Direct Download Artifact Build ==="
        echo "Version: $VERSION"
        echo "Commit: $BRM_BUILD_COMMIT"
        echo ""

        APP_NAME="Better Resource Monitor"
        APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/${APP_NAME}.app"
        APP_EXECUTABLE="$APP_PATH/Contents/MacOS/better-resource-monitor"
        ARTIFACT_DIR="$PWD/dist/release"
        DMG_STAGING="$ARTIFACT_DIR/dmg-staging"
        NOTARY_ZIP="$ARTIFACT_DIR/notary-${VERSION}.zip"
        ZIP_PATH="$ARTIFACT_DIR/Better-Resource-Monitor-${VERSION}-macOS-universal.zip"
        DMG_PATH="$ARTIFACT_DIR/Better-Resource-Monitor-${VERSION}-macOS-universal.dmg"
        if grep -R "IO[R]eport" src-tauri/src src-tauri/Cargo.toml .github scripts; then
          echo "Error: Direct-download source, workflows, or scripts must not reference private GPU sampling APIs"
          exit 1
        fi
        echo "No private GPU sampling source references found"

        rm -rf "$ARTIFACT_DIR"
        mkdir -p "$ARTIFACT_DIR"

        echo "Building universal macOS app bundle..."
        pnpm tauri build --bundles app --target universal-apple-darwin

        if [ ! -d "$APP_PATH" ]; then
          echo "Error: App bundle not found at $APP_PATH"
          exit 1
        fi

        if ! strings -a "$APP_EXECUTABLE" | awk -v needle="$BRM_BUILD_COMMIT" 'index($0, needle) { found = 1 } END { exit found ? 0 : 1 }'; then
          echo "Error: App executable does not contain expected build commit $BRM_BUILD_COMMIT"
          exit 1
        fi
        echo "Build commit embedded successfully"

        if strings -a "$APP_EXECUTABLE" | grep "IO[R]eport"; then
          echo "Error: App executable contains private GPU sampling references"
          exit 1
        fi
        echo "No private GPU sampling executable references found"

        if [ -d "$APP_PATH/Contents/Library/LaunchAgents" ]; then
          echo "Error: App bundle must not embed LaunchAgents"
          exit 1
        fi

        {
          echo "BRM_DIRECT_SOURCE_DIR=$PWD"
          echo "BRM_DIRECT_VERSION=$VERSION"
          echo "BRM_DIRECT_APP_NAME=$APP_NAME"
          echo "BRM_DIRECT_APP_PATH=$APP_PATH"
          echo "BRM_DIRECT_ARTIFACT_DIR=$ARTIFACT_DIR"
          echo "BRM_DIRECT_DMG_STAGING=$DMG_STAGING"
          echo "BRM_DIRECT_NOTARY_ZIP=$NOTARY_ZIP"
          echo "BRM_DIRECT_ZIP_PATH=$ZIP_PATH"
          echo "BRM_DIRECT_DMG_PATH=$DMG_PATH"
        } >> "$GITHUB_ENV"

    - name: Prepare Developer ID credentials
      shell: bash
      env:
        APPLE_API_KEY_ID: ${{ inputs.apple-api-key-id }}
        APPLE_API_ISSUER: ${{ inputs.apple-api-issuer }}
        APPSTORE_CONNECT_API_KEY_P8: ${{ inputs.appstore-connect-api-key-p8 }}
        DEVELOPER_ID_APPLICATION_CERT_P12_BASE64: ${{ inputs.developer-id-application-cert-p12-base64 }}
        DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ inputs.developer-id-application-cert-password }}
      run: |
        set -euo pipefail

        SETUP_SCRIPT="$GITHUB_ACTION_PATH/../../../scripts/setup-developer-id-signing.sh"
        if [ ! -f "$SETUP_SCRIPT" ]; then
          echo "Error: Developer ID signing setup script not found at $SETUP_SCRIPT"
          exit 1
        fi

        bash "$SETUP_SCRIPT"

    - name: Sign, notarize, and package
      id: package
      shell: bash
      env:
        APPLE_API_KEY_ID: ${{ inputs.apple-api-key-id }}
        APPLE_API_ISSUER: ${{ inputs.apple-api-issuer }}
        DEVELOPER_ID_APPLICATION_IDENTITY: ${{ inputs.developer-id-application-identity }}
      run: |
        set -euo pipefail

        cd "$BRM_DIRECT_SOURCE_DIR"

        APP_NAME="$BRM_DIRECT_APP_NAME"
        APP_PATH="$BRM_DIRECT_APP_PATH"
        APP_EXECUTABLE="$APP_PATH/Contents/MacOS/better-resource-monitor"
        ARTIFACT_DIR="$BRM_DIRECT_ARTIFACT_DIR"
        DMG_STAGING="$BRM_DIRECT_DMG_STAGING"
        NOTARY_ZIP="$BRM_DIRECT_NOTARY_ZIP"
        ZIP_PATH="$BRM_DIRECT_ZIP_PATH"
        DMG_PATH="$BRM_DIRECT_DMG_PATH"
        KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

        required_vars=("APPLE_API_KEY_ID" "APPLE_API_ISSUER" "DEVELOPER_ID_APPLICATION_IDENTITY")
        for var in "${required_vars[@]}"; do
          if [ -z "${!var:-}" ]; then
            echo "Error: $var is not set"
            exit 1
          fi
        done

        if [ ! -f "$KEY_PATH" ]; then
          echo "Error: App Store Connect API key not found at $KEY_PATH"
          exit 1
        fi

        submit_for_notarization() {
          local package_path="$1"
          local label="$2"
          local notary_out
          local submission_id

          notary_out="$(mktemp "${TMPDIR:-/tmp}/brm-notary.XXXXXX")"
          if ! xcrun notarytool submit "$package_path" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait > "$notary_out" 2>&1; then
            cat "$notary_out"
            submission_id="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$notary_out" | head -n 1 || true)"
            if [ -n "$submission_id" ]; then
              echo "=== Notarization log for $label submission $submission_id ==="
              xcrun notarytool log "$submission_id" \
                --key "$KEY_PATH" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER" || true
            fi
            rm -f "$notary_out"
            exit 1
          fi

          cat "$notary_out"
          rm -f "$notary_out"
        }

        echo "Signing nested code with: $DEVELOPER_ID_APPLICATION_IDENTITY"
        while IFS= read -r -d '' item; do
          echo "Signing nested component: $item"
          codesign --force --options runtime \
            --sign "$DEVELOPER_ID_APPLICATION_IDENTITY" \
            "$item"
        done < <(find "$APP_PATH/Contents" -depth \( -name "*.dylib" -o -name "*.so" -o -name "*.framework" \) -print0)

        while IFS= read -r -d '' item; do
          if [ "$item" = "$APP_EXECUTABLE" ]; then
            continue
          fi
          echo "Signing helper executable: $item"
          codesign --force --options runtime \
            --sign "$DEVELOPER_ID_APPLICATION_IDENTITY" \
            "$item"
        done < <(find "$APP_PATH/Contents/MacOS" -type f -print0)

        echo "Signing app with: $DEVELOPER_ID_APPLICATION_IDENTITY"
        codesign --force --options runtime \
          --sign "$DEVELOPER_ID_APPLICATION_IDENTITY" \
          --entitlements src-tauri/Entitlements.plist \
          "$APP_PATH"

        codesign --verify --deep --strict "$APP_PATH"
        echo "Signature verified."

        echo "Submitting app bundle for notarization..."
        ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"
        submit_for_notarization "$NOTARY_ZIP" "app bundle"

        xcrun stapler staple "$APP_PATH"
        spctl -a -vv "$APP_PATH"

        echo "Creating ZIP artifact..."
        ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

        echo "Creating DMG artifact..."
        mkdir -p "$DMG_STAGING"
        ditto "$APP_PATH" "$DMG_STAGING/${APP_NAME}.app"
        ln -s /Applications "$DMG_STAGING/Applications"
        hdiutil create \
          -volname "$APP_NAME" \
          -srcfolder "$DMG_STAGING" \
          -ov \
          -format UDZO \
          "$DMG_PATH"

        echo "Submitting DMG for notarization..."
        submit_for_notarization "$DMG_PATH" "DMG"

        xcrun stapler staple "$DMG_PATH"
        spctl -a -vv -t open --context context:primary-signature "$DMG_PATH"

        echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
        echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

        echo ""
        echo "Artifacts ready:"
        ls -lh "$DMG_PATH" "$ZIP_PATH"
